name: Bitrix24 audit Windows checks
on:
  push:
    paths:
      - 'bitrix24-audit/**'
      - '.github/workflows/bitrix24-audit-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
        working-directory: bitrix24-audit
    steps:
      - name: Preserve the exact release file bytes during checkout
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Check native PowerShell and parse every script
        run: |
          $ErrorActionPreference='Stop'
          $PSVersionTable
          if($PSVersionTable.PSVersion.Major -ne 5){throw 'Requires Windows PowerShell 5.1'}
          Get-ChildItem *.ps1 | ForEach-Object {
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ($errors|Out-String)}
          }
      - name: Verify downloaded ZIP matches tested source files
        run: |
          $destination=Join-Path $env:RUNNER_TEMP 'audit-package'
          Expand-Archive ./bitrix24_gui.zip -DestinationPath $destination
          Get-ChildItem $destination -File | ForEach-Object {
            $reference=Join-Path $pwd $_.Name
            if(-not (Test-Path $reference)){throw "Unexpected archive file: $($_.Name)"}
            if((Get-FileHash $_.FullName).Hash -ne (Get-FileHash $reference).Hash){throw "Stale archive file: $($_.Name)"}
          }
          if(-not (Test-Path (Join-Path $destination 'START_GUI.cmd'))){throw 'Archive missing launcher'}
      - name: GUI process, parameters, cancellation, employee list
        if: always()
        run: ./bitrix24_gui.ps1 -SelfTest
      - name: History attribution, period and legacy caches
        if: always()
        run: ./TEST_HISTORY.ps1
      - name: Scope and incremental results
        if: always()
        run: ./TEST_ACCESS.ps1
      - name: Rate limits and cooperative cancellation
        if: always()
        run: ./TEST_RATE_LIMITS.ps1
      - name: Priority and batch collection recovery
        if: always()
        run: ./TEST_BATCH.ps1
      - name: Large portal source scheduling and partial results
        if: always()
        run: ./TEST_LARGE_PORTAL.ps1
      - name: Source skip controls and live waiting indicator
        if: always()
        run: ./TEST_CONTROLS.ps1
      - name: Actual HTTP error bodies and retry headers
        if: always()
        run: |
          python ./TEST_HTTP.py --powershell powershell.exe
          if($LASTEXITCODE -ne 0){throw 'HTTP regression failed'}
      - name: Create and render actual WPF window
        if: always()
        run: |
          & powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File ./bitrix24_gui.ps1 -UiSmokeTest -SmokeOutput "$pwd/window.png"
          if($LASTEXITCODE -ne 0){throw 'WPF window smoke test failed'}
      - name: Preserve Windows UI image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-wpf-smoke
          path: bitrix24-audit/window.png
          if-no-files-found: ignore
